<main class="main">
  <section class="card authcard" aria-label="تسجيل الدخول">
    <div class="seg" role="tablist"><span class="on" role="tab" aria-selected="true">تسجيل الدخول</span><span role="tab" aria-selected="false">إنشاء حساب</span></div>
    <div class="stack">
      <label class="field"><span class="label">الموبايل أو البريد</span><input class="input focus num tel" type="tel" placeholder="010 0000 0000"></label>
      <label class="field"><span class="label">كلمة السر</span><input class="input" type="password" value="••••••••"></label>
      <button class="btn btn-primary btn-block"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>دخول</button>
    </div>
    <a class="forgot" href="#">نسيت كلمة السر؟ نرسل لك رابط استعادة</a>
    <div class="or">أو</div>
    <a class="btn btn-line btn-block" href="03-cart-checkout.html">تابع الشراء كضيف بلا حساب</a>
  </section>
  <section class="after" aria-label="ماذا يرى العميل بعد الدخول">
